'  html.ap-on [data-el="w-row"].ap-live{transform:translate3d(4px,0,0)}',
'  html.ap-on [data-row="track"].ap-live [data-el="t-sign"],',
'  html.ap-on [data-el="note"].ap-live [data-el="note-sign"]{transform:scale(1.15);color:#fff}',

'  html.ap-on [data-el="fab-item"].ap-live{transform:translate3d(0,-3px,0);',
'    border-color:rgba(122,155,245,.55) !important;box-shadow:0 10px 30px rgba(0,0,0,.4)}',

'  html.ap-on [data-el="stage"].ap-live,html.ap-on [data-rail].ap-live{transform:translate3d(0,-4px,0);',
'    box-shadow:0 14px 38px rgba(0,0,0,.45)}',
'  html.ap-on [data-el="stage"].ap-live [data-fig="step"]{color:#fff}',

'  html.ap-on [data-node].ap-live{transform:scale(1.12)}',
'  html.ap-on [data-el="faq-item"].ap-live [data-el="faq-sign"]{',
'    border-color:rgba(122,155,245,.65);transform:scale(1.1);color:#fff}',

'  /* a soft blue wash marks the row you are looking at */',
'  html.ap-on [data-row="track"].ap-live,html.ap-on [data-el="w-row"].ap-live,',
'  html.ap-on [data-el="faq-item"].ap-live{background:rgba(62,104,232,.055)}',

'  /* the CTA sweep fires once, when it arrives */',
'  html.ap-on .cta.ap-swept::before,html.ap-on .cta-ghost.ap-swept::before{',
'    transform:scaleX(1);opacity:1;transition:transform .9s cubic-bezier(.16,1,.3,1),opacity .5s ease}',
'  html.ap-on .cta.ap-live,html.ap-on .cta-ghost.ap-live{transform:translate3d(0,-2px,0);',
'    border-color:rgba(90,128,240,.9);box-shadow:0 0 22px rgba(62,104,232,.45)}',
'  html.ap-on .cta.ap-live .cta-arrow,html.ap-on .cta-ghost.ap-live .cta-arrow{transform:translate3d(5px,-1px,0)}',
'}',

'/* nothing moves for anyone who asked for that */',
'@media (prefers-reduced-motion: reduce){',
'  html.ap-on [data-ap],html.ap-on [data-ap-x],html.ap-on [data-ap-num],html.ap-on [data-ap-eb],html.ap-on [data-ap-hero]{',
'    opacity:1 !important;transform:none !important;filter:none !important;clip-path:none !important;letter-spacing:inherit !important;transition:none !important}',
'  html.ap-on .ap-rule::after{transform:scaleX(1) !important;transition:none !important}',
'  #ap-prog{display:none}',
'  html.ap-on .ap-live{transform:none !important}',
'}'
].join('\n');

var _cssBusy = false;
function mountCSS(){
  if (_cssBusy) return;
  var head = document.head || document.documentElement;
  if (!head) return;
  var st = document.getElementById('ap-motion-css');
  if (!st){
    st = document.createElement('style');
    st.id = 'ap-motion-css';
    st.textContent = CSS;
  }
  /* The runtime rebuilds the document and appends its own stylesheets after
     ours, which would let them win on equal specificity. Keep this sheet last. */
  var sheets = document.querySelectorAll('style,link[rel="stylesheet"]');
  if (st.parentNode === head && sheets.length && sheets[sheets.length - 1] === st) return;
  _cssBusy = true;
  try { head.appendChild(st); } catch(e) {}
  _cssBusy = false;
}
mountCSS();
try{
  new MutationObserver(function(){ mountCSS(); })
    .observe(document.documentElement, {childList:true, subtree:true});
}catch(e){}
[80, 300, 800, 1600, 3000, 5000].forEach(function(t){ setTimeout(mountCSS, t); });
window.addEventListener('load', mountCSS);

/* ---------- 1b. blob: images -> data: URIs ------------------------------
   The runtime serves the logo and other bundled images as blob: URLs. Those
   are tied to the page's origin and its lifetime, so they break the moment
   the page is embedded, sandboxed under a strict CSP, or the object URL is
   revoked. Swapping each one for a data: URI once it has loaded makes the
   image independent of all of that.
   ----------------------------------------------------------------------- */
function deblob(){
  var imgs = document.querySelectorAll('img[src^="blob:"]:not([data-ap-blob])');
  for (var i = 0; i < imgs.length; i++){
    (function(img){
      img.setAttribute('data-ap-blob','1');
      var src = img.getAttribute('src');
      try{
        fetch(src).then(function(r){ return r.blob(); }).then(function(bl){
          var fr = new FileReader();
          fr.onload = function(){
            if (typeof fr.result === 'string' && fr.result.indexOf('data:') === 0){
              /* every img sharing this blob gets the same data URI */
              var same = document.querySelectorAll('img[src="' + src + '"]');
              for (var k = 0; k < same.length; k++) same[k].src = fr.result;
              if (img.getAttribute('src') === src) img.src = fr.result;
            }
          };
          fr.readAsDataURL(bl);
        }).catch(function(){});
      }catch(e){}
    })(imgs[i]);
  }
}
deblob();
[200, 700, 1500, 2600, 4200].forEach(function(t){ setTimeout(deblob, t); });
window.addEventListener('load', deblob);

/* ---------- 2. open at the top, and stay there ---------- */
if ('scrollRestoration' in history){ try{ history.scrollRestoration = 'manual'; }catch(e){} }
function hardTop(){
  try{ window.scrollTo(0,0); }catch(e){}
  if (document.documentElement) document.documentElement.scrollTop = 0;
  if (document.body) document.body.scrollTop = 0;
}
var topArmed = false;
function armedTop(){ if (topArmed) hardTop(); }
function toTop(){
  topArmed = true; hardTop();
  if (window.requestAnimationFrame) requestAnimationFrame(function(){ armedTop(); requestAnimationFrame(armedTop); });
  setTimeout(armedTop,60); setTimeout(armedTop,200); setTimeout(armedTop,460);
  setTimeout(function(){ topArmed = false; },520);
}
if (!location.hash) toTop();
document.addEventListener('DOMContentLoaded', function(){ if(!location.hash) toTop(); });
window.addEventListener('load', function(){ if(!location.hash) toTop(); });
window.addEventListener('pageshow', function(e){ if(e.persisted && !location.hash) toTop(); });
/* an in-page anchor still wins */
document.addEventListener('click', function(e){
  var a = e.target && e.target.closest && e.target.closest('a[href^="#"]');
  if (a && a.getAttribute('href').length > 1) topArmed = false;
}, true);

if (REDUCED) return;   /* progress bar and reveals both stay off */

/* ---------- 3. the engine -------------------------------------------------
   The runtime clones its template into the document, which throws away any
   node references and JS properties we hold. So nothing here caches nodes:
   every pass re-queries the DOM, and every mark is an attribute or an inline
   style, both of which survive a clone.
   -------------------------------------------------------------------------- */
var REVEAL_SEL = [
  '[data-el="stage"]','[data-el="fab-item"]','[data-el="faq-item"]',
  '[data-row="track"]','[data-el="w-row"]','[data-el="note"]',
  '[data-rail]','[data-fabric]','[data-tabs]','figure','table','blockquote'
].join(',');

var LIVE_SEL = '[data-row="track"],[data-el="note"],[data-el="w-row"],[data-el="fab-item"],' +
               '[data-el="stage"],[data-rail],[data-node],[data-el="faq-item"]';

var NUM = /^\s*([£$]?)(\d[\d,]*)(\.\d+)?\s*(%|\+|x|×|K|M|B)?\s*$/;

function inChrome(el){ return !!(el.closest && el.closest('header,[data-nav="panel"],#ap-prog')); }

/* --- mark: idempotent, safe to run any number of times ------------------- */
function mark(){
  var n = 0;

  [].slice.call(document.querySelectorAll(REVEAL_SEL)).forEach(function(el){
    if (el.hasAttribute('data-ap') || el.hasAttribute('data-ap-x') || inChrome(el)) return;
    el.setAttribute('data-ap',''); n++;
  });

  [].slice.call(document.querySelectorAll('section')).forEach(function(sec){
    if (inChrome(sec)) return;
    sec.classList.add('ap-rule');
    [].slice.call(sec.querySelectorAll('h1,h2,h3,p')).slice(0,6).forEach(function(el){
      if (el.hasAttribute('data-ap') || el.hasAttribute('data-ap-x')) return;
      if (el.closest('[data-el="stage"],[data-el="fab-item"],[data-el="faq-item"],[data-row="track"],[data-el="w-row"]')) return;
      if (inChrome(el)) return;
      el.setAttribute('data-ap-x',''); n++;
    });
  });

  /* stagger, written as an inline style so it survives a clone */
  [['[data-el="fab-item"]',0.055],['[data-el="stage"]',0.075],['[data-el="faq-item"]',0.045],
   ['[data-row="track"]',0.04],['[data-el="w-row"]',0.045]].forEach(function(pair){
    var groups = [], seen = [];
    [].slice.call(document.querySelectorAll(pair[0])).forEach(function(el){
      var par = el.parentNode; if (!par) return;
      var k = seen.indexOf(par);
      if (k === -1){ seen.push(par); groups.push([el]); } else groups[k].push(el);
    });
    groups.forEach(function(g){
      g.forEach(function(el,i){
        var d = Math.min(i*pair[1], 0.44) + 's';
        if (el.style.transitionDelay !== d) el.style.transitionDelay = d;
      });
    });
  });

  /* the big 01 / 02 / 03 sheet numerals */
  [].slice.call(document.querySelectorAll('section span,section div,section p')).forEach(function(el){
    if (el.children.length || el.hasAttribute('data-ap-num') || inChrome(el)) return;
    var t = (el.textContent || '').trim();
    if (!/^0\d$/.test(t)) return;
    if (parseFloat(getComputedStyle(el).fontSize) < 24) return;
    el.setAttribute('data-ap-num',''); n++;
  });

  /* mono eyebrow labels */
  [].slice.call(document.querySelectorAll('section span,section p,section div')).forEach(function(el){
    if (el.children.length || el.hasAttribute('data-ap-eb') || inChrome(el)) return;
    if (el.classList.contains('sc-interp') || el.closest('.sc-interp')) return;
    var t = (el.textContent || '').trim();
    if (t.length < 4 || t.length > 44) return;
    var cs = getComputedStyle(el);
    if (cs.textTransform !== 'uppercase') return;
    if (parseFloat(cs.letterSpacing) < 1.5) return;
    if (parseFloat(cs.fontSize) > 17) return;
    el.setAttribute('data-ap-eb',''); n++;
  });

  /* the hero headline */
  var h1 = document.querySelector('section h1, h1');
  if (h1 && !h1.hasAttribute('data-ap-hero') && !inChrome(h1)){
    h1.removeAttribute('data-ap-x');
    h1.setAttribute('data-ap-hero',''); n++;
  }

  /* count-up candidates, tagged by attribute so the data survives a clone */
  [].slice.call(document.querySelectorAll('section *')).forEach(function(el){
    if (el.children.length || el.hasAttribute('data-ap-count') || inChrome(el)) return;
    var t = el.textContent || '';
    if (t.length > 8) return;
    var m = NUM.exec(t); if (!m) return;
    var val = parseFloat(m[2].replace(/,/g,'') + (m[3]||''));
    if (!(val >= 10)) return;
    /* Only headline figures count up. Everything else that happens to be a
       number - list markers, sheet numbers, years, the live tickers the site
       already animates - is left exactly as written. */
    var hasUnit = !!(m[1] || m[4]);
    if (!hasUnit && val >= 1900 && val <= 2100) return;          /* a year */
    /* .sc-interp values are animated by the site's own runtime - leave them alone */
    if (el.classList.contains('sc-interp') || el.closest('.sc-interp')) return;
    if (el.closest('ol,li,nav,footer,[data-tick],[data-el="t-sign"],[data-el="note-sign"],[data-el="faq-sign"]')) return;
    var fs = parseFloat(getComputedStyle(el).fontSize) || 0;
    if (fs < 20) return;                                          /* body-size digits are labels */
    if (!hasUnit && fs < 30) return;                              /* a bare number needs to be big */
    el.setAttribute('data-ap-count', JSON.stringify({p:m[1]||'', s:m[4]||'', v:val, d:(m[3]||'').length?1:0, raw:t.trim()}));
    n++;
  });

  return n;
}

/* --- reveal ------------------------------------------------------------- */
function sweep(force){
  var els = document.querySelectorAll('[data-ap]:not(.ap-in),[data-ap-x]:not(.ap-in),.ap-rule:not(.ap-in),' +
                                     '[data-ap-num]:not(.ap-in),[data-ap-eb]:not(.ap-in),[data-ap-hero]:not(.ap-in)');
  var vh = window.innerHeight;
  for (var i = 0; i < els.length; i++){
    var el = els[i];
    if (force || el.getBoundingClientRect().top < vh * 1.02) el.classList.add('ap-in');
  }
}

/* --- count-up ----------------------------------------------------------- */
function runCount(el){
  if (el.getAttribute('data-ap-counted')) return;
  var d; try{ d = JSON.parse(el.getAttribute('data-ap-count')); }catch(e){ return; }
  el.setAttribute('data-ap-counted','1');
  var t0 = null, dur = 1100;
  function step(ts){
    if (t0 === null) t0 = ts;
    var k = Math.min(1, (ts - t0)/dur);
    var e = 1 - Math.pow(1 - k, 3);
    var v = d.v * e;
    el.textContent = d.p + (d.d ? v.toFixed(1) : Math.round(v).toLocaleString('en-CA')) + d.s;
    if (k < 1) requestAnimationFrame(step); else el.textContent = d.raw;
  }
  requestAnimationFrame(step);
}
function sweepCounts(){
  var els = document.querySelectorAll('[data-ap-count]:not([data-ap-counted])');
  var vh = window.innerHeight;
  for (var i = 0; i < els.length; i++){
    var r = els[i].getBoundingClientRect();
    if (r.top < vh * 0.88 && r.bottom > 0) runCount(els[i]);
  }
}

/* --- touch: the block nearest the middle of the screen goes live -------- */
function updateLive(){
  if (!TOUCH) return;
  var els = document.querySelectorAll(LIVE_SEL);
  var vh = window.innerHeight, mid = vh * 0.46;
  var bestKey = {}, bestD = {};
  for (var i = 0; i < els.length; i++){
    var el = els[i];
    el.classList.remove('ap-live');
    if (inChrome(el)) continue;
    var r = el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > vh) continue;
    var d = Math.abs((r.top + r.height/2) - mid);
    if (d > vh * 0.42) continue;
    var g = el.getAttribute('data-el') || el.getAttribute('data-row') || 'x';
    if (bestD[g] === undefined || d < bestD[g]){ bestD[g] = d; bestKey[g] = el; }
  }
  for (var k in bestKey) bestKey[k].classList.add('ap-live');
}

/* --- the CTA sweeps once, on arrival (touch only) ----------------------- */
function sweepCTA(){
  if (!TOUCH) return;
  var els = document.querySelectorAll('.cta:not(.ap-swept),.cta-ghost:not(.ap-swept)');
  var vh = window.innerHeight;
  for (var i = 0; i < els.length; i++){
    var el = els[i], r = el.getBoundingClientRect();
    if (r.top < vh * 0.8 && r.bottom > 0){
      el.classList.add('ap-swept','ap-live');
      (function(e){ setTimeout(function(){ e.classList.remove('ap-live'); }, 1400); })(el);
    }
  }
}

/* --- chrome: progress bar + condensed header ---------------------------- */
function chrome(){
  var prog = document.getElementById('ap-prog');
  if (!prog && document.body){
    prog = document.createElement('div'); prog.id = 'ap-prog'; document.body.appendChild(prog);
  }
  if (!prog) return;
  if (prog.parentNode !== document.body && document.body) document.body.appendChild(prog);
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  var h = (document.documentElement.scrollHeight - window.innerHeight) || 1;
  prog.style.width = Math.max(0, Math.min(100, (y/h)*100)) + '%';
  document.documentElement.classList.toggle('ap-scrolled', y > 60);
}

/* --- one pass ----------------------------------------------------------- */
var started = false;
function pass(){
  if (!document.querySelector('section')) return;
  if (!started){ started = true; document.documentElement.classList.add('ap-on'); }
  mark(); deblob(); chrome(); sweep(false); sweepCounts(); sweepCTA(); updateLive();
}

/* scroll is cheap and rAF-throttled */
var ticking = false;
function onScroll(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(function(){ chrome(); sweep(false); sweepCounts(); sweepCTA(); updateLive(); ticking = false; });
}
window.addEventListener('scroll', onScroll, {passive:true});
window.addEventListener('resize', onScroll, {passive:true});

/* the runtime clones its template in, which is a DOM change: re-mark then */
var reScan = null;
try{
  new MutationObserver(function(){
    if (reScan) return;
    reScan = setTimeout(function(){ reScan = null; pass(); }, 40);
  }).observe(document.documentElement, {childList:true, subtree:true});
}catch(e){}

document.addEventListener('DOMContentLoaded', pass);
window.addEventListener('load', pass);
[60,160,320,600,1000,1600,2400,3400,4800].forEach(function(t){ setTimeout(pass, t); });

/* nothing is ever left invisible */
setTimeout(function(){ mark(); sweep(true); }, 6000);
setTimeout(function(){ sweep(true); }, 9000);
})();
