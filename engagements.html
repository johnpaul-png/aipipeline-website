00 14px/1 'Geist',sans-serif;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#F3F4F7\">Live systems<\u002Fa>\n<a href=\"notes.html\" style=\"font:400 14px/1 'Geist',sans-serif;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#F3F4F7\">Field notes<\u002Fa>\n<\u002Fdiv>\n<div data-el=\"footcol\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:0\">\n<span style=\"font:400 11px/1 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#8A90A2;padding-bottom:20px\">Company<\u002Fspan>\n<a href=\"index.html\" style=\"font:400 14px/1 'Geist',sans-serif;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#F3F4F7\">Index<\u002Fa>\n<a href=\"practice.html\" style=\"font:400 14px/1 'Geist',sans-serif;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#F3F4F7\">About<\u002Fa>\n<a href=\"notes.html\" style=\"font:400 14px/1 'Geist',sans-serif;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#F3F4F7\">Notes<\u002Fa>\n<a href=\"contact.html\" style=\"font:400 14px/1 'Geist',sans-serif;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#F3F4F7\">Contact<\u002Fa>\n<a href=\"https://aipipelineportal.ca/\" style=\"font:400 14px/1 'Geist',sans-serif;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#F3F4F7\">Client portal<\u002Fa>\n<\u002Fdiv>\n<div data-el=\"footcol\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:0\">\n<span style=\"font:400 11px/1 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#8A90A2;padding-bottom:20px\">Contact<\u002Fspan>\n<a href=\"mailto:contact@aipipeline.ca\" style=\"font:400 13px/1 'Geist Mono',monospace;letter-spacing:.01em;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#7A9BF5\">contact@aipipeline.ca<\u002Fa>\n<a href=\"mailto:support@aipipeline.ca\" style=\"font:400 13px/1 'Geist Mono',monospace;letter-spacing:.01em;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#7A9BF5\">support@aipipeline.ca<\u002Fa>\n<a href=\"mailto:billing@aipipeline.ca\" style=\"font:400 13px/1 'Geist Mono',monospace;letter-spacing:.01em;color:#A8AEBE;padding:13px 0;transition:color .18s\" style-hover=\"color:#7A9BF5\">billing@aipipeline.ca<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid rgba(150,172,230,.16)\">\n<div data-el=\"footbar\" style=\"max-width:1280px;margin:0 auto;padding:24px clamp(24px,5vw,64px);display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n<span style=\"font:400 11.5px/1.4 'Geist Mono',monospace;letter-spacing:.1em;color:#8A90A2\">© AI Pipeline 2026. All rights reserved.<\u002Fspan>\n<span style=\"display:flex;gap:28px;flex-wrap:wrap\">\n<a href=\"privacy.html\" style=\"font:400 11.5px/1.4 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#8A90A2;transition:color .18s\" style-hover=\"color:#F3F4F7\">Privacy policy<\u002Fa>\n<a href=\"terms.html\" style=\"font:400 11.5px/1.4 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#8A90A2;transition:color .18s\" style-hover=\"color:#F3F4F7\">Terms<\u002Fa>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state={mode:\"retainer\",spend:48,people:14,hours:9};\n  fmt(n){\n    if(n>=1000000) return \"$\"+(n/1000000).toFixed(1)+\"M\";\n    if(n>=1000) return \"$\"+Math.round(n/1000)+\"K\";\n    return \"$\"+Math.round(n);\n  }\n  renderVals(){\n    const S=this.state;\n    // transparent model: manual labour drives the saving, operating spend caps it\n    const WORKING_WEEKS=46, LOADED_RATE=70, AUTOMATION_RATE=0.60;\n    const hoursBack=Math.round(S.people*S.hours*WORKING_WEEKS);\n    const laborCost=hoursBack*LOADED_RATE;\n    const addressable=Math.min(laborCost,S.spend*1000000);\n    const saving=addressable*AUTOMATION_RATE;\n\n    const stages=[\n      {num:\"01\",name:\"Audit\",headline:\"The 15-minute operations audit\",sub:\"NO OBLIGATION\",\n       desc:\"A focused audit of how your operation runs. Every inefficiency mapped, ranked, and costed against your own numbers. Nothing is built — you walk away with a clear target and the business case to act on it.\",\n       items:[\"15-minute operations audit to open\",\"Ranked workflow inventory\",\"Time and dollar cost per workflow\",\"One target metric for the engagement\",\"Go / no-go recommendation, no sequence\"],\n       foot:\"TYPICALLY BOOKED WITHIN 3 BUSINESS DAYS\",\n       nodeBg:\"#3E68E8\",nodeLine:\"#3E68E8\",numColor:\"#7A9BF5\"},\n      {num:\"02\",name:\"Pilot build\",headline:\"One workflow, shipped and measured\",sub:\"SCOPED PER ENGAGEMENT\",\n       desc:\"One workflow, one crew, production data, real users. Shipped in short increments and judged on the single metric agreed in the audit — not on a feature list.\",\n       items:[\"Dedicated engineering pod\",\"Read-first integration to your stack\",\"Continuous deployment and review\",\"Measured before / after on the metric\",\"A person approves every automated output\",\"Source and documentation handed over\"],\n       foot:\"A WORKING SYSTEM IN A CREW'S HANDS\",\n       nodeBg:\"#0B0D14\",nodeLine:\"rgba(62,104,232,.65)\",numColor:\"#9AA1B4\"},\n      {num:\"03\",name:\"Fleet rollout\",headline:\"Every site, on the same system\",sub:\"SCALE\",\n       desc:\"The proven pilot goes out across rigs, districts, or plants. Training is built into the shift pattern rather than bolted on, and adoption is tracked per site so the ones that lag get attention instead of a reminder email.\",\n       items:[\"Multi-site rollout with adoption data\",\"Training built into the shift pattern\",\"Runbooks and escalation paths\",\"Audit trail configured for your regulator\",\"Named support with response SLAs\"],\n       foot:\"SCOPED AFTER A SUCCESSFUL PILOT\",\n       nodeBg:\"#0B0D14\",nodeLine:\"rgba(122,155,245,.5)\",numColor:\"#9AA1B4\"},\n      {num:\"04\",name:\"Optimize\",headline:\"Continuously tuned on your own history\",sub:\"OPTIMIZE\",\n       desc:\"Models drift, contracts change, regulations move. We monitor performance, retrain on the history the system is now accumulating, and extend into the next workflow on the list from the audit.\",\n       items:[\"Quarterly performance and drift review\",\"Continuous retraining on your history\",\"Next workflow scoped and queued\",\"Deployment into your own cloud tenancy\",\"Source and models remain yours\"],\n       foot:\"ONGOING · REVIEWED EVERY QUARTER\",\n       nodeBg:\"#0B0D14\",nodeLine:\"rgba(255,255,255,.3)\",numColor:\"#9AA1B4\"}\n    ];\n\n    const mk=(key,label,min,max,step,value,display,minLabel,maxLabel)=>({\n      label,min,max,step,value,display,minLabel,maxLabel,\n      change:(e)=>this.setState({[key]:Number(e.target.value)})});\n\n    return {\n      menuOpen:!!this.state.menu,\n      menuLabel:this.state.menu?\"Close\":\"Menu\",\n      toggleMenu:()=>this.setState(st=>({menu:!st.menu})),\n      stages,\n      sliders:[\n        mk(\"spend\",\"Annual operating spend\",0.5,400,0.5,S.spend,\n           S.spend<1?\"$\"+Math.round(S.spend*1000)+\"K\":\"$\"+(S.spend%1?S.spend.toFixed(1):S.spend)+\"M\",\n           \"$500K\",\"$400M\"),\n        mk(\"people\",\"People on manual reporting\",2,120,1,S.people,S.people+\" staff\",\"2\",\"120\"),\n        mk(\"hours\",\"Manual time per person / week\",2,25,1,S.hours,S.hours+\" h/wk\",\"2 h\",\"25 h\")\n      ],\n      saving:this.fmt(saving),\n      hours:hoursBack.toLocaleString()+\" h\",\n      addressable:this.fmt(addressable),\n      included:[\n        {tag:\"SEC-01\",title:\"Least-privilege access, fully audited\"},\n        {tag:\"SEC-02\",title:\"Canada Central data residency\"},\n        {tag:\"OPS-01\",title:\"Runbooks and escalation paths\"},\n        {tag:\"OPS-02\",title:\"Training inside the shift pattern\"},\n        {tag:\"GOV-01\",title:\"Model version and approver on every output\"},\n        {tag:\"GOV-02\",title:\"Regulator-ready audit trail\"},\n        {tag:\"OWN-01\",title:\"Source and models handed over\"},\n        {tag:\"OWN-02\",title:\"No hostage architecture\"}\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
